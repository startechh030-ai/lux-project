name: Build Signed Luxe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore persistent signing keystore
        env:
          LUXE_KEYSTORE_BASE64: ${{ secrets.LUXE_KEYSTORE_BASE64 }}
        run: |
          test -n "$LUXE_KEYSTORE_BASE64" || { echo "LUXE_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$LUXE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luxe-release.jks"
          test -s "$RUNNER_TEMP/luxe-release.jks" || { echo "Decoded keystore is empty"; exit 1; }
          chmod 600 "$RUNNER_TEMP/luxe-release.jks"

      - name: Print keystore certificate fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LUXE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUXE_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/luxe-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -E "Alias name:|SHA256:"

      - name: Build signed release APK
        env:
          LUXE_KEYSTORE_FILE: ${{ runner.temp }}/luxe-release.jks
          LUXE_KEYSTORE_PASSWORD: ${{ secrets.LUXE_KEYSTORE_PASSWORD }}
          LUXE_KEY_ALIAS: ${{ secrets.LUXE_KEY_ALIAS }}
          LUXE_KEY_PASSWORD: ${{ secrets.LUXE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signature and record certificate
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/SIGNING_CERTIFICATE.txt
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxeTexture3D-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/SIGNING_CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 30
