name: Build Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore release keystore
        env:
          LUXE_KEYSTORE_BASE64: ${{ secrets.LUXE_KEYSTORE_BASE64 }}
        run: |
          test -n "$LUXE_KEYSTORE_BASE64"
          printf '%s' "$LUXE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luxe-release.jks"
          test -s "$RUNNER_TEMP/luxe-release.jks"
          chmod 600 "$RUNNER_TEMP/luxe-release.jks"

      - name: Build signed release APK
        env:
          LUXE_KEYSTORE_FILE: ${{ runner.temp }}/luxe-release.jks
          LUXE_KEYSTORE_PASSWORD: ${{ secrets.LUXE_KEYSTORE_PASSWORD }}
          LUXE_KEY_ALIAS: ${{ secrets.LUXE_KEY_ALIAS }}
          LUXE_KEY_PASSWORD: ${{ secrets.LUXE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Create SHA-256 checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxeTexture3D-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
